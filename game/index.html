<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher — a tiny browser game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1026; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// Star Catcher — one prompt, one file.
// Move the basket, catch falling stars (+10), dodge the bombs (-1 life).
// 3 lives. It gets faster as you score. Mouse, touch or arrow keys.
// Add ?demo=1 to the URL and the basket plays itself.
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, S = 1; // S = scale factor vs a 1080x1920 frame
  var DEMO = /[?&]demo=1/.test(location.search);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = H / 1920;
  }
  window.addEventListener("resize", resize);
  resize();

  // Seeded RNG so demo runs look the same every time.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(20261123);

  // Background twinkle stars (fixed, seeded).
  var bgStars = [];
  for (var i = 0; i < 90; i++) {
    bgStars.push({ x: rand(), y: rand(), r: 0.6 + rand() * 1.8, p: rand() * 6.28, s: 0.5 + rand() * 2 });
  }

  var state = "title"; // title | playing | over
  var score = 0, lives = 3, level = 1;
  var items = [];
  var spawnT = 0, elapsed = 0, stateT = 0, overT = 0, flash = 0;
  var basket = { x: 0, w: 170, h: 36, targetX: 0 };
  basket.x = W / 2;
  basket.targetX = W / 2;

  function startGame() {
    state = "playing";
    stateT = 0;
    score = 0; lives = 3; level = 1;
    items = [];
    spawnT = 0.4;
    basket.x = W / 2;
    basket.targetX = W / 2;
  }

  function spawn() {
    var bombChance = Math.min(0.15 + level * 0.02, 0.32);
    var kind = rand() < bombChance ? "bomb" : "star";
    var r = (kind === "star" ? 26 : 24) * S + 14;
    items.push({
      kind: kind,
      x: 40 + rand() * (W - 80),
      y: -40,
      vy: (250 + level * 34 + rand() * 90) * S,
      r: r,
      rot: rand() * 6.28,
      vr: (rand() - 0.5) * 2.4
    });
  }

  function setTarget(clientX) {
    basket.targetX = Math.max(basket.w / 2, Math.min(W - basket.w / 2, clientX));
  }
  window.addEventListener("mousemove", function (e) { setTarget(e.clientX); });
  window.addEventListener("touchmove", function (e) {
    if (e.touches.length) { setTarget(e.touches[0].clientX); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { basket.targetX = Math.max(basket.w / 2, basket.targetX - 70); }
    if (e.key === "ArrowRight") { basket.targetX = Math.min(W - basket.w / 2, basket.targetX + 70); }
    if (state !== "playing") { startGame(); }
    if (e.key === "r" || e.key === "R") { startGame(); }
  });
  window.addEventListener("mousedown", function () {
    if (state !== "playing") { startGame(); }
  });

  function drawStar(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = (i % 2 === 0) ? r : r * 0.45;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fillStyle = "#ffd34d";
    ctx.shadowColor = "#ffbf00";
    ctx.shadowBlur = 22 * S;
    ctx.fill();
    ctx.restore();
  }

  function drawBomb(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fillStyle = "#2b2b3a";
    ctx.shadowColor = "#ff4d4d";
    ctx.shadowBlur = 16 * S;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#ff6b6b";
    ctx.lineWidth = 3 * S;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.5, -r * 1.5, r * 0.9, -r * 1.1);
    ctx.stroke();
    ctx.fillStyle = "#ffe066";
    ctx.beginPath();
    ctx.arc(r * 0.9, -r * 1.1, 5 * S, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = "#ff4d4d";
    ctx.font = "bold " + Math.round(r * 0.9) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("!", 0, r * 0.08);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // Sky.
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1026");
    g.addColorStop(0.55, "#1b2350");
    g.addColorStop(1, "#3a1c5e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Twinkling background stars.
    for (var i = 0; i < bgStars.length; i++) {
      var bs = bgStars[i];
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(elapsed * bs.s + bs.p));
      ctx.globalAlpha = tw;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(bs.x * W, bs.y * H, bs.r * S + 0.6, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ground line.
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.fillRect(0, H - 44 * S, W, 2);

    // Items.
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      if (it.kind === "star") { drawStar(it.x, it.y, it.r, it.rot); }
      else { drawBomb(it.x, it.y, it.r, it.rot); }
    }

    // Basket.
    var by = H - 96 * S;
    ctx.save();
    ctx.shadowColor = "#ffb020";
    ctx.shadowBlur = 18 * S;
    roundRect(basket.x - basket.w / 2, by, basket.w, basket.h, 14 * S);
    ctx.fillStyle = "#ffb020";
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffcf5c";
    roundRect(basket.x - basket.w / 2, by, basket.w, 12 * S, 8 * S);
    ctx.fill();
    ctx.restore();

    // HUD.
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + Math.round(92 * S) + "px sans-serif";
    ctx.fillText(String(score), W / 2, 34 * S);
    ctx.font = "bold " + Math.round(30 * S) + "px sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillText("SCORE", W / 2, (34 + 96) * S);

    ctx.textAlign = "left";
    ctx.font = Math.round(52 * S) + "px sans-serif";
    var hearts = "";
    for (var h = 0; h < 3; h++) { hearts += (h < lives) ? "❤" : "♡"; }
    ctx.fillText(hearts, 28 * S, 40 * S);

    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "bold " + Math.round(30 * S) + "px sans-serif";
    ctx.fillText("LEVEL " + level, W - 28 * S, 52 * S);

    // Damage flash.
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,60,60," + (flash * 0.28) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    // Title overlay.
    if (state === "title") {
      ctx.fillStyle = "rgba(8,10,32,0.62)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd34d";
      ctx.font = "bold " + Math.round(120 * S) + "px sans-serif";
      ctx.fillText("⭐ STAR", W / 2, H * 0.30);
      ctx.fillText("CATCHER", W / 2, H * 0.30 + 132 * S);
      ctx.fillStyle = "#ffffff";
      ctx.font = Math.round(44 * S) + "px sans-serif";
      ctx.fillText("Catch the stars. Dodge the bombs.", W / 2, H * 0.46);
      ctx.fillText("3 lives. It gets faster as you score.", W / 2, H * 0.46 + 62 * S);
      ctx.fillStyle = "#ffd34d";
      ctx.font = "bold " + Math.round(40 * S) + "px sans-serif";
      var blink = (Math.floor(elapsed * 2) % 2 === 0);
      if (blink) { ctx.fillText(DEMO ? "Watch it play itself…" : "Click or press any key to start", W / 2, H * 0.58); }
    }

    // Game over overlay.
    if (state === "over") {
      ctx.fillStyle = "rgba(8,10,32,0.66)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "bold " + Math.round(110 * S) + "px sans-serif";
      ctx.fillText("GAME OVER", W / 2, H * 0.34);
      ctx.fillStyle = "#ffffff";
      ctx.font = Math.round(52 * S) + "px sans-serif";
      ctx.fillText("Score: " + score, W / 2, H * 0.46);
      ctx.fillStyle = "#ffd34d";
      ctx.font = "bold " + Math.round(40 * S) + "px sans-serif";
      if (Math.floor(elapsed * 2) % 2 === 0) {
        ctx.fillText(DEMO ? "Playing again…" : "Press R or click to play again", W / 2, H * 0.56);
      }
    }
  }

  // Fixed-step update: one slice of game logic. The frame loop below feeds
  // it in 1/60 s slices, so the game advances correctly even when the
  // browser hands it big time jumps (headless screenshots do).
  function update(dt) {
    elapsed += dt;
    stateT += dt;
    if (flash > 0) { flash = Math.max(0, flash - dt * 2.2); }

    if (state === "title") {
      if (DEMO && stateT > 0.6) { startGame(); }
    } else if (state === "playing") {
      level = 1 + Math.floor(score / 50);
      spawnT -= dt;
      if (spawnT <= 0) {
        spawn();
        spawnT = Math.max(0.32, 0.85 - level * 0.05) * (0.75 + rand() * 0.5);
      }
      // Basket movement.
      if (DEMO) {
        var target = null, nearestY = 1e9;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          if (it.kind === "star" && it.y < H - 200 * S && it.y < nearestY) { nearestY = it.y; target = it; }
        }
        if (target) { basket.targetX = target.x; }
        // Dodge a bomb right above the basket.
        for (var k = 0; k < items.length; k++) {
          var b = items[k];
          if (b.kind === "bomb" && b.y > H - 420 * S && Math.abs(b.x - basket.x) < 110) {
            basket.targetX = (b.x < W / 2) ? Math.min(W - basket.w / 2, basket.x + 260) : Math.max(basket.w / 2, basket.x - 260);
          }
        }
      }
      var dx = basket.targetX - basket.x;
      var maxStep = 1500 * S * dt;
      basket.x += Math.max(-maxStep, Math.min(maxStep, dx));

      // Items fall and collide.
      var by = H - 96 * S;
      for (var m = items.length - 1; m >= 0; m--) {
        var item = items[m];
        item.y += item.vy * dt;
        item.rot += item.vr * dt;
        if (item.y > H + 60) { items.splice(m, 1); continue; }
        var caught = Math.abs(item.x - basket.x) < (basket.w / 2 + item.r * 0.6) &&
                     item.y + item.r > by && item.y - item.r < by + basket.h;
        if (caught) {
          if (item.kind === "star") { score += 10; }
          else { lives -= 1; flash = 1; if (lives <= 0) { state = "over"; overT = 0; } }
          items.splice(m, 1);
        }
      }
    } else if (state === "over") {
      overT += dt;
      if (DEMO && overT > 2.0) { startGame(); }
    }
  }

  var lastT = null;
  var acc = 0;
  function frame(now) {
    var t = now / 1000;
    if (lastT === null) { lastT = t; }
    var dt = Math.min(t - lastT, 1.0);
    lastT = t;
    acc += dt;
    var steps = 0;
    while (acc >= 1 / 60 && steps < 600) { update(1 / 60); acc -= 1 / 60; steps++; }
    if (steps >= 600) { acc = 0; }
    draw();
    requestAnimationFrame(frame);
  }

  // Demo mode starts at once. ?t=<seconds> fast-forwards the game before
  // the first paint, so a screenshot shows the game exactly t seconds in.
  if (DEMO) {
    startGame();
    var tm = /[?&]t=([0-9.]+)/.exec(location.search);
    if (tm) {
      var want = parseFloat(tm[1]);
      var n = Math.round(want * 60);
      for (var s = 0; s < n; s++) { update(1 / 60); }
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
